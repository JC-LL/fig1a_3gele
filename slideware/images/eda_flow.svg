<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Stage box template: x=10, width=240, height=56, gap=24 -->
  <!-- Stage 1 -->
  <rect x="10" y="4" width="240" height="56" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="37" text-anchor="middle" font-size="13">System Specification</text>
  <line x1="130" y1="60" x2="130" y2="80" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="10" y="84" width="240" height="56" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="117" text-anchor="middle" font-size="13">Architectural Design</text>
  <line x1="130" y1="140" x2="130" y2="160" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="10" y="164" width="240" height="66" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="191" text-anchor="middle" font-size="13">Functional Design</text>
  <text x="130" y="207" text-anchor="middle" font-size="13">and Logic Design (RTL)</text>
  <line x1="130" y1="230" x2="130" y2="250" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="10" y="254" width="240" height="56" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="287" text-anchor="middle" font-size="13">Logic Synthesis</text>
  <line x1="130" y1="310" x2="130" y2="330" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <rect x="10" y="334" width="240" height="56" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="367" text-anchor="middle" font-size="13">Physical Design</text>
  <line x1="130" y1="390" x2="130" y2="410" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 6 -->
  <rect x="10" y="414" width="240" height="66" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="441" text-anchor="middle" font-size="13">Physical Verification</text>
  <text x="130" y="457" text-anchor="middle" font-size="13">and Signoff</text>
  <line x1="130" y1="480" x2="130" y2="500" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 7 -->
  <rect x="10" y="504" width="240" height="56" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="537" text-anchor="middle" font-size="13">Fabrication</text>
  <line x1="130" y1="560" x2="130" y2="580" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 8 -->
  <rect x="10" y="584" width="240" height="56" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="617" text-anchor="middle" font-size="13">Packaging and Testing</text>
  <line x1="130" y1="640" x2="130" y2="660" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 9 -->
  <rect x="10" y="664" width="240" height="56" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="130" y="697" text-anchor="middle" font-size="13">Chip</text>
</svg>

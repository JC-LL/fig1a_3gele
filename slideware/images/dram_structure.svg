  <rect x="680" y="200" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>
  <rect x="720" y="200" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>
  <rect x="760" y="200" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>
  <rect x="800" y="200" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  
  <!-- Row 2 -->
  <rect x="520" y="240" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="560" y="240" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>
  <rect x="600" y="240" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>
  <rect x="640" y="240" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>
  <rect x="680" y="240" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>
  <rect x="720" y="240" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="760" y="240" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="800" y="240" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>
  
  <!-- Row 3 -->
  <rect x="520" y="280" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="560" y="280" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="600" y="280" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="640" y="280" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="680" y="280" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="720" y="280" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>

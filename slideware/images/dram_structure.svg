  <line x1="190" y1="370" x2="210" y2="370" stroke="#0066CC" stroke-width="1.5"/>
  <line x1="190" y1="385" x2="210" y2="385" stroke="#CC0000" stroke-width="1.5"/>
  
  <!-- ===== CONNECTIONS FROM ROW ADDRESS BUFFER TO DECODER ===== -->
  <line x1="340" y1="225" x2="450" y2="225" stroke="#CC0000" stroke-width="1.5"/>
  <line x1="340" y1="240" x2="450" y2="240" stroke="#0066CC" stroke-width="1.5"/>
  <line x1="340" y1="255" x2="450" y2="255" stroke="#CC0000" stroke-width="1.5"/>
  
  <!-- ===== CONNECTIONS FROM DECODER TO MEMORY ARRAY ===== -->
  <line x1="495" y1="177" x2="520" y2="177" stroke="#CC0000" stroke-width="1"/>
  <line x1="495" y1="217" x2="520" y2="217" stroke="#CC0000" stroke-width="1"/>
  <line x1="495" y1="257" x2="520" y2="257" stroke="#CC0000" stroke-width="1"/>
  <line x1="495" y1="297" x2="520" y2="297" stroke="#CC0000" stroke-width="1"/>
  <line x1="495" y1="337" x2="520" y2="337" stroke="#CC0000" stroke-width="1"/>
  <line x1="495" y1="377" x2="520" y2="377" stroke="#FFD700" stroke-width="2"/>
  <line x1="495" y1="417" x2="520" y2="417" stroke="#CC0000" stroke-width="1"/>
  <line x1="495" y1="457" x2="520" y2="457" stroke="#CC0000" stroke-width="1"/>
  
  <!-- ===== CONNECTIONS FROM MEMORY ARRAY TO SENSE AMPLIFIERS ===== -->
  <line x1="537" y1="480" x2="537" y2="485" stroke="#999" stroke-width="1"/>
  <line x1="577" y1="480" x2="577" y2="485" stroke="#999" stroke-width="1"/>
  <line x1="617" y1="480" x2="617" y2="485" stroke="#999" stroke-width="1"/>
  <line x1="657" y1="480" x2="657" y2="485" stroke="#999" stroke-width="1"/>
  <line x1="697" y1="480" x2="697" y2="485" stroke="#999" stroke-width="1"/>
  <line x1="737" y1="480" x2="737" y2="485" stroke="#999" stroke-width="1"/>
  <line x1="777" y1="480" x2="777" y2="485" stroke="#999" stroke-width="1"/>
  <line x1="817" y1="480" x2="817" y2="485" stroke="#999" stroke-width="1"/>
  
  <!-- ===== CONNECTIONS FROM SENSE AMPLIFIERS TO COLUMN MUX ===== -->
  <line x1="680" y1="530" x2="680" y2="535" stroke="#999" stroke-width="1.5"/>
  
  <!-- ===== CONNECTIONS FROM COLUMN MUX TO DATA BUFFER ===== -->
  <line x1="820" y1="558" x2="920" y2="558" stroke="#999" stroke-width="2"/>
  
  <!-- ===== CONNECTIONS FROM DATA BUFFER TO DATA IN/OUT ===== -->
  <line x1="1020" y1="562" x2="1040" y2="562" stroke="#999" stroke-width="1.5"/>
  
  <!-- ===== RED/BLUE LINES FROM TIMING GOING UP ===== -->
  <line x1="275" y1="190" x2="275" y2="50" stroke="#CC0000" stroke-width="1.5"/>
  <line x1="310" y1="190" x2="310" y2="60" stroke="#0066CC" stroke-width="1.5"/>
  <line x1="340" y1="190" x2="340" y2="70" stroke="#CC0000" stroke-width="1.5"/>
  
  <line x1="275" y1="50" x2="450" y2="50" stroke="#CC0000" stroke-width="1.5"/>
  <line x1="310" y1="60" x2="450" y2="60" stroke="#0066CC" stroke-width="1.5"/>
  <line x1="340" y1="70" x2="450" y2="70" stroke="#CC0000" stroke-width="1.5"/>
  
  <line x1="450" y1="50" x2="450" y2="150" stroke="#CC0000" stroke-width="1.5"/>
  <line x1="450" y1="60" x2="450" y2="150" stroke="#0066CC" stroke-width="1.5"/>

  <circle cx="1045" cy="562" r="5" fill="white" stroke="#999" stroke-width="1.5"/>
  <line x1="1020" y1="562" x2="1040" y2="562" stroke="#999" stroke-width="1.5"/>
  
  <!-- Connection from Column Mux to Data Buffer -->
  <line x1="820" y1="558" x2="920" y2="558" stroke="#999" stroke-width="2"/>
  
  <!-- Connection from Data Buffer to Data In/Out -->
  <line x1="1020" y1="562" x2="1040" y2="562" stroke="#999" stroke-width="1.5"/>
  
  <!-- ===== CONNECTIONS FROM COLUMN ADDRESS BUFFER TO COLUMN MUX ===== -->

  <line x1="577" y1="155" x2="577" y2="480" stroke="#CC0000" stroke-width="1" opacity="0.5"/>
  <line x1="617" y1="155" x2="617" y2="480" stroke="#CC0000" stroke-width="1" opacity="0.5"/>
  <line x1="657" y1="155" x2="657" y2="480" stroke="#CC0000" stroke-width="1" opacity="0.5"/>
  <line x1="697" y1="155" x2="697" y2="480" stroke="#CC0000" stroke-width="1" opacity="0.5"/>
  <line x1="737" y1="155" x2="737" y2="480" stroke="#CC0000" stroke-width="1" opacity="0.5"/>
  <line x1="777" y1="155" x2="777" y2="480" stroke="#CC0000" stroke-width="1" opacity="0.5"/>
  <line x1="817" y1="155" x2="817" y2="480" stroke="#CC0000" stroke-width="1" opacity="0.5"/>
  
  <!-- Horizontal word lines (light blue) -->

  <rect x="560" y="440" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="600" y="440" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="640" y="440" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="680" y="440" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="720" y="440" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="760" y="440" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="800" y="440" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>
  
  <!-- Word line (yellow horizontal line) -->

  <text x="472" y="300" font-size="12" fill="white" text-anchor="middle" transform="rotate(90, 472, 300)">Row Address Decoder</text>
  
  <!-- Connections from Row Address Buffer to Row Address Decoder -->
  <line x1="340" y1="220" x2="450" y2="220" stroke="#CC0000" stroke-width="1.5"/>
  <line x1="340" y1="240" x2="450" y2="240" stroke="#0066CC" stroke-width="1.5"/>
  <line x1="340" y1="260" x2="450" y2="260" stroke="#CC0000" stroke-width="1.5"/>
  
  <!-- Address values near connections -->
  <text x="355" y="215" font-size="10" fill="#CC0000">1</text>
  <text x="370" y="215" font-size="10" fill="#0066CC">0</text>
  <text x="385" y="215" font-size="10" fill="#CC0000">1</text>
  
  <!-- ===== MEMORY CELL ARRAY ===== -->
  <!-- Grid of 8 columns x 8 rows -->
  <!-- Row 0 -->
  <rect x="520" y="160" width="35" height="35" fill="#CC0000" stroke="#999" stroke-width="0.5"/>
  <rect x="560" y="160" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="600" y="160" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="640" y="160" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="680" y="160" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="720" y="160" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="760" y="160" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="800" y="160" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  
  <!-- Row 1 -->
  <rect x="520" y="200" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="560" y="200" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>

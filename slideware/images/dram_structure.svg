  <text x="680" y="513" font-size="14" fill="white" text-anchor="middle">Sense Amplifiers</text>
  
  <!-- ===== COLUMN MULTIPLEXER/DEMULTIPLEXER ===== -->
  <polygon points="510,535 850,535 820,580 540,580" fill="#5B9E5B"/>
  <text x="680" y="563" font-size="11" fill="white" text-anchor="middle">Column Multiplexer/Demultiplexer</text>
  
  <!-- ===== DATA BUFFER ===== -->

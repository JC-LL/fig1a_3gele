  <rect x="800" y="280" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  
  <!-- Row 4 (word line row) -->
  <rect x="520" y="320" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="560" y="320" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="600" y="320" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="640" y="320" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="680" y="320" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>
  <rect x="720" y="320" width="35" height="35" fill="#7FB3D5" stroke="#999" stroke-width="0.5"/>

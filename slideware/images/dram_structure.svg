  <line x1="515" y1="217" x2="840" y2="217" stroke="#7FB3D5" stroke-width="1" opacity="0.5"/>
  <line x1="515" y1="257" x2="840" y2="257" stroke="#7FB3D5" stroke-width="1" opacity="0.5"/>
  <line x1="515" y1="297" x2="840" y2="297" stroke="#7FB3D5" stroke-width="1" opacity="0.5"/>
  <line x1="515" y1="337" x2="840" y2="337" stroke="#7FB3D5" stroke-width="1" opacity="0.5"/>
  <line x1="515" y1="377" x2="840" y2="377" stroke="#7FB3D5" stroke-width="1" opacity="0.5"/>
  <line x1="515" y1="417" x2="840" y2="417" stroke="#7FB3D5" stroke-width="1" opacity="0.5"/>
  <line x1="515" y1="457" x2="840" y2="457" stroke="#7FB3D5" stroke-width="1" opacity="0.5"/>
  
  <!-- ===== SENSE AMPLIFIERS ===== -->

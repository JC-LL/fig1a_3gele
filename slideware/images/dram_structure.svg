  <line x1="275" y1="558" x2="540" y2="558" stroke="#999" stroke-width="1.5"/>
  
  <line x1="310" y1="395" x2="310" y2="550" stroke="#999" stroke-width="1.5"/>
  <line x1="310" y1="550" x2="540" y2="550" stroke="#999" stroke-width="1.5"/>
  
  <line x1="340" y1="395" x2="340" y2="542" stroke="#999" stroke-width="1.5"/>
  <line x1="340" y1="542" x2="540" y2="542" stroke="#999" stroke-width="1.5"/>
  
  <!-- ===== MEMORY ADDRESS LINE (bottom) ===== -->

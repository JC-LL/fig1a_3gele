<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Arial, sans-serif">
  <rect width="1200" height="720" fill="white"/>
  
  <!-- ===== INPUT SIGNALS (left side) ===== -->
  <!-- RAS -->
  <text x="30" y="195" font-size="14" fill="#333">RAS</text>
  <line x1="55" y1="190" x2="62" y2="190" stroke="#333" stroke-width="1"/>
  <line x1="55" y1="188" x2="62" y2="188" stroke="#333" stroke-width="1"/>
  <circle cx="80" cy="190" r="8" fill="white" stroke="#999" stroke-width="1.5"/>
  <text x="76" y="194" font-size="12" fill="#333">0</text>
  <line x1="88" y1="190" x2="140" y2="190" stroke="#CC0000" stroke-width="2"/>
  
  <!-- Address 1 -->
  <text x="15" y="275" font-size="14" fill="#333">Address</text>
  <circle cx="80" cy="270" r="8" fill="white" stroke="#999" stroke-width="1.5"/>
  <text x="76" y="274" font-size="12" fill="#CC0000">1</text>
  <line x1="88" y1="270" x2="140" y2="270" stroke="#CC0000" stroke-width="2"/>
  
  <!-- Address 0 -->
  <circle cx="80" cy="295" r="8" fill="white" stroke="#999" stroke-width="1.5"/>
  <text x="76" y="299" font-size="12" fill="#0066CC">0</text>
  <line x1="88" y1="295" x2="140" y2="295" stroke="#0066CC" stroke-width="2"/>
  
  <!-- Address 1 -->
  <circle cx="80" cy="320" r="8" fill="white" stroke="#999" stroke-width="1.5"/>
  <text x="76" y="324" font-size="12" fill="#CC0000">1</text>
  <line x1="88" y1="320" x2="140" y2="320" stroke="#CC0000" stroke-width="2"/>
  
  <!-- CAS -->
  <text x="30" y="375" font-size="14" fill="#333">CAS</text>
  <line x1="55" y1="370" x2="62" y2="370" stroke="#333" stroke-width="1"/>
  <line x1="55" y1="368" x2="62" y2="368" stroke="#333" stroke-width="1"/>
  <circle cx="80" cy="370" r="8" fill="white" stroke="#999" stroke-width="1.5"/>
  <text x="76" y="374" font-size="12" fill="#CC0000">1</text>
  <line x1="88" y1="370" x2="140" y2="370" stroke="#CC0000" stroke-width="2"/>
  
  <!-- WE -->
  <text x="30" y="425" font-size="14" fill="#333">WE</text>
  <line x1="55" y1="420" x2="62" y2="420" stroke="#333" stroke-width="1"/>
  <line x1="55" y1="418" x2="62" y2="418" stroke="#333" stroke-width="1"/>
  <circle cx="80" cy="420" r="8" fill="white" stroke="#999" stroke-width="1.5"/>
  <text x="76" y="424" font-size="12" fill="#CC0000">1</text>
  <line x1="88" y1="420" x2="140" y2="420" stroke="#CC0000" stroke-width="2"/>
  
  <!-- ===== TIMING AND CONTROL ===== -->
  <rect x="140" y="180" width="50" height="280" fill="#2E6B9E" rx="2"/>
  <text x="165" y="260" font-size="13" fill="white" text-anchor="middle" transform="rotate(90, 165, 260)">Timing and Control</text>
  
  <!-- ===== ROW ADDRESS BUFFER ===== -->
  <rect x="210" y="210" width="130" height="55" fill="#5B9BD5" rx="2"/>
  <text x="275" y="232" font-size="12" fill="white" text-anchor="middle">Row Address</text>
  <text x="275" y="248" font-size="12" fill="white" text-anchor="middle">Buffer</text>
  
  <!-- Connection from Timing to Row Address Buffer -->
  <line x1="190" y1="220" x2="210" y2="220" stroke="#CC0000" stroke-width="1.5"/>
  <line x1="190" y1="240" x2="210" y2="240" stroke="#0066CC" stroke-width="1.5"/>
  <line x1="190" y1="260" x2="210" y2="260" stroke="#CC0000" stroke-width="1.5"/>
  
  <!-- ===== COLUMN ADDRESS BUFFER ===== -->
  <rect x="210" y="340" width="130" height="55" fill="#5B9BD5" rx="2"/>
  <text x="275" y="362" font-size="12" fill="white" text-anchor="middle">Column Address</text>
  <text x="275" y="378" font-size="12" fill="white" text-anchor="middle">Buffer</text>
  
  <!-- Connection from Timing to Column Address Buffer -->
  <line x1="190" y1="350" x2="210" y2="350" stroke="#CC0000" stroke-width="1.5"/>
  <line x1="190" y1="370" x2="210" y2="370" stroke="#0066CC" stroke-width="1.5"/>
  <line x1="190" y1="390" x2="210" y2="390" stroke="#CC0000" stroke-width="1.5"/>
  
  <!-- ===== ROW ADDRESS DECODER ===== -->

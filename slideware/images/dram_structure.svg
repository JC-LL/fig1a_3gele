  <circle cx="650" cy="690" r="5" fill="#CC0000"/>
  <text x="150" y="710" font-size="12" fill="#CC0000">Memory Address</text>
  
  <!-- ===== CONNECTIONS FROM TIMING TO INPUTS ===== -->
  <!-- RAS to Timing -->
  <line x1="140" y1="190" x2="140" y2="190" stroke="#CC0000" stroke-width="1.5"/>
  
  <!-- Address to Timing -->
  <line x1="140" y1="270" x2="140" y2="270" stroke="#CC0000" stroke-width="1.5"/>
  <line x1="140" y1="295" x2="140" y2="295" stroke="#0066CC" stroke-width="1.5"/>
  <line x1="140" y1="320" x2="140" y2="320" stroke="#CC0000" stroke-width="1.5"/>
  
  <!-- CAS to Timing -->
  <line x1="140" y1="370" x2="140" y2="370" stroke="#CC0000" stroke-width="1.5"/>
  
  <!-- WE to Timing -->
  <line x1="140" y1="420" x2="140" y2="420" stroke="#CC0000" stroke-width="1.5"/>
  
  <!-- ===== CONNECTIONS FROM TIMING TO BUFFERS ===== -->
  <!-- To Row Address Buffer -->
  <line x1="190" y1="225" x2="210" y2="225" stroke="#CC0000" stroke-width="1.5"/>
  <line x1="190" y1="240" x2="210" y2="240" stroke="#0066CC" stroke-width="1.5"/>
  <line x1="190" y1="255" x2="210" y2="255" stroke="#CC0000" stroke-width="1.5"/>
  
  <!-- To Column Address Buffer -->

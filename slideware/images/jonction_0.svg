<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <defs>
    <!-- Flèches de tension -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc0000"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc"/>
    </marker>
  </defs>

  <!-- Titre -->
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Polarisation d'une jonction PN</text>

  <!-- Ligne de séparation -->
  <line x1="400" y1="50" x2="400" y2="470" stroke="#aaa" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ============================================ -->
  <!-- PARTIE GAUCHE : POLARISATION DIRECTE -->
  <!-- ============================================ -->

  <text x="200" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#006600">Polarisation directe</text>

  <!-- Région P -->
  <rect x="80" y="100" width="120" height="120" rx="4" fill="#ffcccc" stroke="#cc3333" stroke-width="2"/>
  <text x="140" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#990000">P</text>
  <text x="140" y="195" text-anchor="middle" font-size="13" fill="#990000">(Accepteurs)</text>

  <!-- Région N -->
  <rect x="200" y="100" width="120" height="120" rx="4" fill="#ccccff" stroke="#3333cc" stroke-width="2"/>
  <text x="260" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#000099">N</text>
  <text x="260" y="195" text-anchor="middle" font-size="13" fill="#000099">(Donneurs)</text>

  <!-- Jonction -->
  <line x1="200" y1="100" x2="200" y2="220" stroke="#333" stroke-width="3" stroke-dasharray="5,3"/>

  <!-- Zone de déplétion réduite (directe) -->
  <rect x="195" y="110" width="10" height="100" fill="#ffdd99" stroke="#cc9933" stroke-width="1" opacity="0.7"/>
  <text x="200" y="250" text-anchor="middle" font-size="10" fill="#996600">Zone de</text>
  <text x="200" y="263" text-anchor="middle" font-size="10" fill="#996600">déplétion</text>
  <text x="200" y="278" text-anchor="middle" font-size="9" fill="#996600" font-style="italic">(réduite)</text>

  <!-- Flèches de courant (direct) -->
  <!-- Courant de gauche à droite -->
  <line x1="60" y1="160" x2="330" y2="160" stroke="#cc0000" stroke-width="2.5" marker-end="url(#arrowhead-red)"/>
  <text x="195" y="145" text-anchor="middle" font-size="13" fill="#cc0000" font-weight="bold">I →</text>

  <!-- Porteurs P→N -->
  <circle cx="110" cy="120" r="6" fill="#ff6666" opacity="0.8"/>
  <circle cx="130" cy="135" r="6" fill="#ff6666" opacity="0.8"/>
  <circle cx="150" cy="118" r="6" fill="#ff6666" opacity="0.8"/>
  <text x="130" y="305" text-anchor="middle" font-size="11" fill="#990000">Trous →</text>

  <!-- Porteurs N→P -->
  <circle cx="280" cy="190" r="6" fill="#4488ff" opacity="0.8"/>
  <circle cx="260" cy="180" r="6" fill="#4488ff" opacity="0.8"/>
  <circle cx="240" cy="192" r="6" fill="#4488ff" opacity="0.8"/>
  <text x="270" y="330" text-anchor="middle" font-size="11" fill="#000099">← Électrons</text>

  <!-- Symbole batterie direct -->
  <rect x="50" y="360" width="60" height="40" rx="3" fill="#eee" stroke="#555" stroke-width="1.5"/>
  <text x="80" y="380" text-anchor="middle" font-size="12" font-weight="bold">V</text>
  <line x1="50" y1="370" x2="30" y2="370" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="355" x2="30" y2="385" stroke="#333" stroke-width="1.5"/>
  <!-- Bornes -->
  <circle cx="25" cy="355" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="25" cy="385" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Polarité -->
  <text x="20" y="350" text-anchor="middle" font-size="12" fill="#cc0000" font-weight="bold">+</text>
  <text x="20" y="400" text-anchor="middle" font-size="12" fill="#3333cc" font-weight="bold">−</text>

  <!-- Connexions -->
  <line x1="80" y1="370" x2="80" y2="280" stroke="#555" stroke-width="1.2"/>
  <line x1="80" y1="280" x2="110" y2="280" stroke="#555" stroke-width="1.2"/>
  <line x1="110" y1="280" x2="110" y2="230" stroke="#555" stroke-width="1.2"/>
  <line x1="110" y1="230" x2="80" y2="230" stroke="#555" stroke-width="1.2"/>
  <line x1="80" y1="230" x2="80" y2="220" stroke="#555" stroke-width="1.2"/>

  <line x1="270" y1="230" x2="270" y2="280" stroke="#555" stroke-width="1.2"/>
  <line x1="270" y1="280" x2="290" y2="280" stroke="#555" stroke-width="1.2"/>
  <line x1="290" y1="280" x2="290" y2="370" stroke="#555" stroke-width="1.2"/>
  <line x1="290" y1="370" x2="310" y2="370" stroke="#555" stroke-width="1.2"/>
  <line x1="310" y1="355" x2="310" y2="385" stroke="#555" stroke-width="1.2"/>

  <!-- Légende direct -->
  <text x="200" y="440" text-anchor="middle" font-size="12" fill="#333">V &gt; Vₜ (seuil)</text>
  <text x="200" y="458" text-anchor="middle" font-size="11" fill="#666">Barrière de potentiel abaissée</text>
  <text x="200" y="476" text-anchor="middle" font-size="11" fill="#666">→ courant important</text>

  <!-- ============================================ -->
  <!-- PARTIE DROITE : POLARISATION INVERSE -->
  <!-- ============================================ -->

  <text x="600" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#993300">Polarisation inverse</text>

  <!-- Région P -->
  <rect x="480" y="100" width="120" height="120" rx="4" fill="#ffcccc" stroke="#cc3333" stroke-width="2"/>
  <text x="540" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#990000">P</text>
  <text x="540" y="195" text-anchor="middle" font-size="13" fill="#990000">(Accepteurs)</text>

  <!-- Région N -->
  <rect x="600" y="100" width="120" height="120" rx="4" fill="#ccccff" stroke="#3333cc" stroke-width="2"/>
  <text x="660" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#000099">N</text>
  <text x="660" y="195" text-anchor="middle" font-size="13" fill="#000099">(Donneurs)</text>

  <!-- Jonction -->
  <line x1="600" y1="100" x2="600" y2="220" stroke="#333" stroke-width="3" stroke-dasharray="5,3"/>

  <!-- Zone de déplétion élargie (inverse) -->
  <rect x="570" y="110" width="60" height="100" fill="#ffdd99" stroke="#cc9933" stroke-width="1" opacity="0.7"/>
  <text x="600" y="250" text-anchor="middle" font-size="10" fill="#996600">Zone de</text>
  <text x="600" y="263" text-anchor="middle" font-size="10" fill="#996600">déplétion</text>
  <text x="600" y="278" text-anchor="middle" font-size="9" fill="#996600" font-style="italic">(élargie)</text>

  <!-- Flèches de courant (très faible) -->
  <!-- Pas de courant significatif -->
  <text x="600" y="145" text-anchor="middle" font-size="12" fill="#999">I ≈ 0</text>

  <!-- Petits porteurs thermiques (courant de fuite) -->
  <circle cx="530" cy="190" r="4" fill="#ff9999" opacity="0.5"/>
  <circle cx="550" cy="200" r="4" fill="#ff9999" opacity="0.5"/>
  <circle cx="640" cy="120" r="4" fill="#99bbff" opacity="0.5"/>
  <circle cx="620" cy="130" r="4" fill="#99bbff" opacity="0.5"/>
  <text x="600" y="305" text-anchor="middle" font-size="10" fill="#999">Courant de fuite</text>
  <text x="600" y="318" text-anchor="middle" font-size="10" fill="#999">(très faible)</text>

  <!-- Symbole batterie inverse -->
  <rect x="550" y="360" width="60" height="40" rx="3" fill="#eee" stroke="#555" stroke-width="1.5"/>
  <text x="580" y="380" text-anchor="middle" font-size="12" font-weight="bold">V</text>
  <line x1="550" y1="370" x2="530" y2="370" stroke="#333" stroke-width="1.5"/>
  <line x1="530" y1="355" x2="530" y2="385" stroke="#333" stroke-width="1.5"/>
  <!-- Bornes -->
  <circle cx="525" cy="355" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="525" cy="385" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Polarité (inversée) -->
  <text x="520" y="350" text-anchor="middle" font-size="12" fill="#3333cc" font-weight="bold">−</text>
  <text x="520" y="400" text-anchor="middle" font-size="12" fill="#cc0000" font-weight="bold">+</text>

  <!-- Connexions (inversées) -->
  <line x1="510" y1="230" x2="510" y2="280" stroke="#555" stroke-width="1.2"/>
  <line x1="510" y1="280" x2="560" y2="280" stroke="#555" stroke-width="1.2"/>
  <line x1="560" y1="280" x2="560" y2="230" stroke="#555" stroke-width="1.2"/>
  <line x1="560" y1="230" x2="540" y2="230" stroke="#555" stroke-width="1.2"/>
  <line x1="540" y1="230" x2="540" y2="220" stroke="#555" stroke-width="1.2"/>

  <line x1="660" y1="230" x2="660" y2="280" stroke="#555" stroke-width="1.2"/>
  <line x1="660" y1="280" x2="610" y2="280" stroke="#555" stroke-width="1.2"/>
  <line x1="610" y1="280" x2="610" y2="370" stroke="#555" stroke-width="1.2"/>
  <line x1="610" y1="370" x2="620" y2="370" stroke="#555" stroke-width="1.2"/>
  <line x1="620" y1="355" x2="620" y2="385" stroke="#555" stroke-width="1.2"/>

  <!-- Légende inverse -->
  <text x="600" y="440" text-anchor="middle" font-size="12" fill="#333">V &lt; Vₜ (seuil)</text>
  <text x="600" y="458" text-anchor="middle" font-size="11" fill="#666">Barrière de potentiel augmentée</text>
  <text x="600" y="476" text-anchor="middle" font-size="11" fill="#666">→ courant bloqué</text>

</svg>

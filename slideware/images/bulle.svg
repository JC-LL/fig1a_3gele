<svg width="300" height="180" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Corps de la bulle -->
  <rect x="20" y="20" width="260" height="120" rx="20" ry="20"
        fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>

  <!-- Queue de la bulle (pointe vers le bas-gauche) -->

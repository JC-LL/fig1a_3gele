        fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <!-- Masque pour cacher le trait du haut de la queue -->
  <rect x="60" y="135" width="30" height="8" fill="#EEEDFE"/>

  <!-- Texte (à remplacer) -->
  <text x="150" y="85" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#26215C">
    Votre texte ici
  </text>
</svg>
